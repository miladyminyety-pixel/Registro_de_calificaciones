# Blueprint de Render: crea el servicio web y la base de datos PostgreSQL.
# Uso: Render Dashboard -> New -> Blueprint -> elegir este repositorio.
services:
  - type: web
    name: registro-de-calificaciones
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --threads 4 --timeout 60 --access-logfile -
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: registro-db
          property: connectionString
      # Render te pedirá estos valores al crear el Blueprint (no quedan en el repositorio)
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      # "true" carga estudiantes y notas de ejemplo (solo si la base está vacía)
      - key: SEED_DEMO_DATA
        value: "false"

databases:
  - name: registro-db
    plan: free
    region: oregon
    databaseName: registro
    user: registro
